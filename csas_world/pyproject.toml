[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "csas_world"
version = "0.1.0"
description = "EfficientZero-style multi-head graph-transformer curling model"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
