# EXP-076: clean operator control for EXP-074.  This is the corrected EXP-065
# best-response collection recipe (exploratory bigsel + significance gating),
# applied to the fixed EXP-070 empirical meta-Nash mixture with learner/init v25.
#
# bigsel is intentionally opponent-unaware at the decision itself: it draws 192
# exploratory learner-policy proposals and ranks each by the incumbent v25 value
# head over 64 common-random-number execution realizations.  The BR information
# enters through mixture-induced states and realized matchup-return value targets,
# exactly as fixed-v14d matchup information entered the successful EXP-065 run.
model:
  use_value: true
  use_policy: true
  use_dynamics: true
  use_consistency: true
  consistency_mode: simsiam
  use_outcome: false
  use_decoder: false
  use_step_reward: true
loss:
  policy_bc: 0.0
  policy_distill: 1.0
  value: 1.5
  value_nll: 0.2
  value_from_mcts: false
  consistency: 1.0
  outcome: 0.0
  step_reward: 0.5
replay:
  unroll_steps: 5
  mix_human: 0.0
  mix_value: 0.30
  mix_sim: 0.10
  mix_mcts: 0.60
  value_use_synthetic: true
search:
  bigsel_candidates: 192
  bigsel_k: 64
  bigsel_temp: 1.35
  bigsel_std: 1.6
  noise_config: configs/noise/v2_fullsheet.json
  policy_candidates: 24
  structured_candidates: 8
  diverse_candidates: 8
  local_candidates: 4
  global_candidates: 4
  soft_topk: 24
  noise_samples: 8
  rollout_greedy_steps: 5
  use_mcts_tree: false
  terminal_rollout_scoring: true
  screen_topk: 8
  dist_sig_t: 2.0
horizon:
  start_horizon: 1
  max_horizon: 10
  include_preplaced: true
  noisy_h2h: true
