# EXP-046 / az_v15-VH: VALUE-HEAD-ONLY continuation (per-head training-schedule test).
# Motivation: the L4 certificate's unfired signal — matchup-true value-val was still
# improving when the h2h gate stopped the leg. Joint continued training is unsafe
# (measured val/strength misalignment); this run freezes EVERYTHING except the value
# head (train_value_head_only) so (a) its val criterion is aligned by construction,
# (b) the deployed proposals are bit-identical, and any h2h change is attributable to V.
# Then gate h2h vs the L4 incumbent (v13it1). Promotion => the certificate was premature
# and 'value-refinement phase' joins the train-to-capacity protocol.
model:
  hidden_dim: 256
  n_layers: 4
  n_heads: 4
  dropout: 0.1
  use_value: true
  use_policy: true
  use_dynamics: true
  use_consistency: true
  consistency_mode: simsiam
  use_outcome: false
  use_decoder: false
  use_step_reward: true
loss:
  policy_bc: 0.0
  policy_distill: 0.0
  value: 1.5
  value_nll: 0.2
  value_from_mcts: true
  consistency: 0.0
  outcome: 0.0
  step_reward: 0.0
  reward_action_conditioned: false
replay:
  unroll_steps: 5
  mix_human: 0.0
  mix_value: 0.05
  mix_sim: 0.10
  mix_mcts: 0.85
  value_use_synthetic: true
search:                        # unused (no collection) — present for config validity
  noise_config: configs/noise/v2_fullsheet.json
  noise_samples: 8
train:
  epochs: 40                   # budget ceiling; early stopping governs
  batch_size: 256
  samples_per_epoch: 90000
  augment: true
  gpus: [0, 1, 2, 3]
  run_name: exp046_valuehead_only
  checkpoint_metric: val_value_mse_mcts
  early_stop_patience: 5
  train_value_head_only: true
  select_value_guard: 0.0
  select_value_guard_metric: val_value_mse_mcts
horizon:
  start_horizon: 1
  max_horizon: 10
  include_preplaced: true
  noisy_h2h: true
