# EXP-038 / az_v14: CAPACITY SCALING — 23.2M params (3.2x the champion's 7.3M),
# trained FROM SCRATCH on the full clean corpus with the az_v13-fixed recipe.
# Tests whether the ~0.566 ceiling is a capacity limit of the 7.3M model.
#
# Data hygiene (assembled by _az_v14_launch.sh per COLLECTIONS.md):
#   * az_v9 it1-2 raw          (9,600 train) — sharp exp021-generation targets (the champion's diet)
#   * az_v13_conf_train        (30,720)      — champion-gen, post-hoc 0.55-confidence-filtered dist
#   * az_v13_ratchet it1-2     (3,840)       — t>=2 significance-gated dist (the cleanest targets)
#   * human BC slice           (mix_human + policy_bc — from-scratch policy bootstrap)
#   * value/sim buffers as usual (grounded MC value targets throughout; VFM=true)
model:
  hidden_dim: 384
  n_layers: 6
  n_heads: 6
  dropout: 0.1
  use_value: true
  use_policy: true
  use_dynamics: true
  use_consistency: true
  consistency_mode: simsiam
  use_outcome: false
  use_decoder: false
  use_step_reward: true
loss:
  policy_bc: 0.3               # from-scratch bootstrap: human BC alongside search distillation
  policy_distill: 1.0
  value: 1.5
  value_nll: 0.2
  value_from_mcts: true
  consistency: 1.0
  outcome: 0.0
  step_reward: 0.5
  reward_action_conditioned: false
replay:
  unroll_steps: 5
  mix_human: 0.15
  mix_value: 0.20
  mix_sim: 0.10
  mix_mcts: 0.55
  value_use_synthetic: true
search:                        # unused (no collection) — present for config validity
  noise_config: configs/noise/v2_fullsheet.json
  noise_samples: 8
train:
  epochs: 60                   # budget ceiling; early stopping governs
  batch_size: 256
  samples_per_epoch: 120000
  augment: true
  gpus: [0, 1, 2, 3]
  run_name: exp038_big_model
  checkpoint_metric: val_policy_distill_mcts
  early_stop_patience: 6
  select_value_guard: 3.0      # looser than fine-tunes (from-scratch calibration takes longer)
horizon:
  start_horizon: 1
  max_horizon: 10
  include_preplaced: true
  noisy_h2h: true
