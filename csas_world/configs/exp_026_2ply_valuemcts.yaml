# EXP-026 / az_v6 collect-time config: TWO-PLY training-time policy-improvement operator.
#
# What changes vs exp_017_deploy_robust.yaml (the baseline collect recipe used for
# EXP-019..022 and our az_v4/v5 runs):
#   * use_mcts_tree: true         — turn on the KR-UCT tree (the dormant code path)
#   * mcts_max_depth: 2           — NEW knob: cap recursion at depth 2 (root → child → leaf-eval)
#   * value_leaf_bootstrap: true  — leaves bootstrap via the value head (cheap GPU call)
#                                    instead of an on-policy MC rollout to terminal (expensive
#                                    CPU sim chain). At max_depth=2 + value-head leaves, per-record
#                                    cost is comparable to 1-ply EZ.
#   * mcts_sims: 60               — shallow tree fills quickly; 60 sims is enough to get
#                                    K1≈15 root children each with ~4 visits (one fresh-leaf
#                                    expansion + a few re-evaluations under noise).
#   * search_root_only: false     — we WANT grandchildren (depth-2)
#   * reward_leaf_select: false   — the tree's q-values come from the value head at leaves,
#                                    not from a per-candidate r̂₂; r̂₂ is for the 1-ply path
#   * collect_step_reward: true   — still collect the 2-step reward records for future use
#                                    (matches exp_017_deploy_robust.yaml's training mix)
#
# Everything else (model heads, loss weights, replay mix, noise config, augment) matches
# exp_017_deploy_robust so iter-N vs iter-0 differs ONLY in the policy that collected
# the data and the 2-ply lookahead operator that targets it.
model:
  use_value: true
  use_policy: true
  use_dynamics: true
  use_consistency: true
  consistency_mode: simsiam
  use_outcome: false
  use_decoder: false
  use_step_reward: true
loss:
  policy_bc: 0.0
  policy_distill: 1.0
  value: 1.5
  value_nll: 0.2
  value_from_mcts: false    # collect-time only — the actual training cfg is exp_021_valuemcts_earlystop
  consistency: 1.0
  outcome: 0.0
  step_reward: 0.5
replay:
  unroll_steps: 5
  mix_human: 0.0
  mix_value: 0.30
  mix_sim: 0.10
  mix_mcts: 0.60
  value_use_synthetic: true
search:
  noise_config: configs/noise/v2_fullsheet.json
  policy_candidates: 96
  diverse_candidates: 96
  soft_topk: 24
  noise_samples: 8                  # still used inside the leaf evaluation for noise averaging
  rollout_greedy_steps: 5
  use_mcts_tree: true               # CHANGED: turn on KR-UCT tree
  mcts_sims: 60                     # shallow 2-ply tree, modest sim budget
  mcts_max_depth: 2                 # CHANGED: 2-ply cap (the new knob)
  value_leaf_bootstrap: true        # CHANGED: value-head bootstrap at leaves (no terminal rollout)
  search_root_only: false           # CHANGED: grandchildren are required at depth 2
  terminal_rollout_scoring: false
  reward_leaf_select: false         # tree-q ranks candidates, not r̂₂
  collect_step_reward: true         # still collect reward targets for the r̂₂ head
train:
  epochs: 8
  batch_size: 256
  samples_per_epoch: 90000
  gpus: [0, 1, 2, 3]
horizon:
  start_horizon: 1
  max_horizon: 10
  rounds_per_stage: 2
  roots_per_stage: 80
  include_preplaced: true
  converge_band: 0.04
  converge_margin_band: 0.10
  converge_patience: 2
  h2h_games_per_order: 80
  noisy_h2h: true
