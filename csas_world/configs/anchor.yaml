# Tuned anchor config (full model). Key differences vs base:
#  * lr_pretrained 5e-5: let the shared trunk co-adapt for VALUE (the value head
#    reads the policy-warm-started trunk; at 1.5e-5 the trunk never adapts and the
#    value head stays near-constant on real states). policy_bc anchors the policy.
#  * value weight 1.5 (prioritise value), consistency 1.0 (free trunk capacity),
#    policy_distill 0.5 (don't over-shift the policy away from a sane prior).
# Use with `--ablation default` so these loss weights are not overwritten.
model:
  use_value: true
  use_policy: true
  use_dynamics: true
  use_outcome: false
  use_decoder: true
  use_consistency: true
  consistency_mode: simsiam
loss:
  policy_bc: 1.0
  policy_distill: 0.5
  value: 1.5
  value_nll: 0.2
  value_from_mcts: false      # value head trains on realized ValueDiff only (baseline-matched)
  outcome: 0.0
  consistency: 1.0
  decoder: 1.0
replay:
  unroll_steps: 5
  mix_human: 0.25
  mix_value: 0.35           # value buffer is now the sole value signal -> weight it up
  mix_sim: 0.10
  mix_mcts: 0.30
  value_use_synthetic: true
horizon:
  start_horizon: 1
  max_horizon: 10
  rounds_per_stage: 1
  roots_per_stage: 150
  include_preplaced: true
  converge_band: 0.04
  converge_patience: 1
  h2h_games_per_order: 40   # keep per-stage head-to-head tractable on the CPU sim
train:
  lr: 0.0003
  lr_pretrained: 5.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  epochs: 25
  batch_size: 256
  augment: true
  samples_per_epoch: 120000
  num_workers: 4
  gpus: [0, 1, 2, 3]
  ddp_backend: gloo
  run_name: anchor_v2
