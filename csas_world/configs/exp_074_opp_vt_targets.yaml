# EXP-074: approximate best-response targets against the current EXP-070
# empirical meta-Nash mixture.  At learner nodes VecTree optimises; at explicit
# first opponent node it integrates a sample from an affordable 16x2 approximation
# to the selected member's deployed 48x8 policy/value selector; deeper opponent
# nodes use that member's raw policy.  Actual game turns remain exact 48x8.
# The opponent is sampled once per game from
# configs/opponents/exp070_meta_nash.json.
#
# The first four plies are explicit.  Beyond that cap, learner and opponent use
# their stochastic raw policies to reach a terminal rule score.  This is the
# affordable first oracle; a matchup-calibrated V_mu leaf is the intended later
# replacement.  Root integration uses 64 execution outcomes, per EXP-071/073.
model:
  use_value: true
  use_policy: true
  use_dynamics: true
  use_consistency: true
  consistency_mode: simsiam
  use_outcome: false
  use_decoder: false
  use_step_reward: true
loss:
  policy_bc: 0.0
  policy_distill: 1.0
  value: 1.5
  value_nll: 0.2
  value_from_mcts: false
  consistency: 1.0
  outcome: 0.0
  step_reward: 0.5
replay:
  unroll_steps: 5
  mix_human: 0.0
  mix_value: 0.30
  mix_sim: 0.10
  mix_mcts: 0.60
  value_use_synthetic: true
search:
  vectree_budget: 16000
  vectree_depth: 4
  vectree_out_cap: 8
  vectree_root_out_cap: 64
  vectree_inner_pool: 8
  opponent_model_actions: 1
  opponent_model_deploy_depth: 1
  opponent_model_candidates: 16
  opponent_model_noise_samples: 2
  noise_config: configs/noise/v2_fullsheet.json
  policy_candidates: 24
  structured_candidates: 8
  diverse_candidates: 8
  local_candidates: 4
  global_candidates: 4
  soft_topk: 24
  noise_samples: 8
  rollout_temp: 0.6
  rollout_greedy_steps: 5
  use_mcts_tree: false
  terminal_rollout_scoring: true
  dist_sig_t: 2.0
horizon:
  start_horizon: 1
  max_horizon: 10
  include_preplaced: true
  noisy_h2h: true
