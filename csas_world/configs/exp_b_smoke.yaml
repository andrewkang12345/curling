# Tiny GPU smoke of the EXP-009 reward path (collect 2-step targets -> train reward head -> h2h).
model: {use_value: true, use_policy: true, use_dynamics: true, use_consistency: true,
        consistency_mode: simsiam, use_outcome: false, use_decoder: false, use_step_reward: true}
loss: {policy_bc: 0.0, policy_distill: 1.0, value: 1.5, value_nll: 0.2, value_from_mcts: false,
       consistency: 1.0, outcome: 0.0, step_reward: 0.5}
replay: {unroll_steps: 5, mix_human: 0.0, mix_value: 0.30, mix_sim: 0.10, mix_mcts: 0.60, value_use_synthetic: true}
search:
  noise_config: configs/noise/v2_fullsheet.json
  policy_candidates: 32
  diverse_candidates: 32
  soft_topk: 16
  noise_samples: 2
  rollout_greedy_steps: 5
  use_mcts_tree: true
  mcts_sims: 12
  mcts_uct_c: 0.6
  collect_step_reward: true
train: {epochs: 2, batch_size: 256, samples_per_epoch: 4000, gpus: [0, 1, 2, 3]}
horizon: {start_horizon: 2, max_horizon: 2, rounds_per_stage: 1, roots_per_stage: 8,
          include_preplaced: false, converge_band: 0.04, converge_patience: 1, h2h_games_per_order: 3}
