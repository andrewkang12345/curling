# EXP-052: NEW-RULES retrain (WORLD_BOUNDARY_REMOVAL=1).
# Identical to exp_048 (the corrected-loop L8 recipe) except run_name; trained on the
# az_v19_newrules corpus (champion self-play under boundary-removal transition semantics:
# stones die past the back line / on side boards, so early-takeout legality binds).
# Known mixed-semantics caveat: mix_sim (0.10) consistency buffers are old-rules
# transitions; representation-level only. Human value anchor (0.10) is real-curling
# data and thus MORE consistent with the new rules than with the old ones.
model:
  hidden_dim: 256
  n_layers: 8
  n_heads: 4
  dropout: 0.1
  use_value: true
  use_policy: true
  use_dynamics: true
  use_consistency: true
  consistency_mode: simsiam
  use_outcome: false
  use_decoder: false
  use_step_reward: true
loss:
  policy_bc: 0.0
  policy_distill: 1.0
  value: 1.5
  value_nll: 0.2
  value_from_mcts: true
  consistency: 1.0
  outcome: 0.0
  step_reward: 0.5
  reward_action_conditioned: false
replay:
  unroll_steps: 5
  mix_human: 0.0
  mix_value: 0.10
  mix_sim: 0.10
  mix_mcts: 0.80
  value_use_synthetic: true
search:                        # unused (no collection) — present for config validity
  noise_config: configs/noise/v2_fullsheet.json
  noise_samples: 8
train:
  epochs: 20                   # budget ceiling; early stopping governs
  batch_size: 256
  samples_per_epoch: 90000
  augment: true
  gpus: [0]
  run_name: exp_069_vectree
  checkpoint_metric: val_policy_distill_mcts
  early_stop_patience: 4
  select_value_guard: 5.50
  select_value_guard_metric: val_value_mse_mcts
horizon:
  start_horizon: 1
  max_horizon: 10
  include_preplaced: true
  noisy_h2h: true
