# AlphaZero/MuZero-style config (the sound iterative setup):
#  * MCTS collection rolls the greedy trajectory to TERMINAL (rollout_greedy_steps
#    >= max horizon) -> value targets are realized Monte-Carlo end-score margins,
#    not 1-ply value-model bootstraps.
#  * value_from_mcts: true  -> the value head trains on those MC terminal returns
#    (sound now that they are terminal-grounded), alongside the realized-ValueDiff
#    value buffer.
#  * policy_bc: 0  -> pure search-distillation (no human behaviour cloning); the
#    human warm-start provides grounding, and the policy is free to surpass human play.
# Intended for the iterative loop: collect (current policy+value) -> train -> recollect
# -> ... until head-to-head winrate plateaus.
model:
  use_value: true
  use_policy: true
  use_dynamics: true
  use_outcome: false
  use_decoder: true
  use_consistency: true
  consistency_mode: simsiam
loss:
  policy_bc: 0.0            # AlphaZero-style: pure search distillation
  policy_distill: 1.0
  value: 1.5
  value_nll: 0.2
  value_from_mcts: true     # value head trains on terminal MC returns (now sound)
  outcome: 0.0
  consistency: 1.0
  decoder: 1.0
replay:
  unroll_steps: 5
  mix_human: 0.10          # human kept only as a small replay slice (no BC loss)
  mix_value: 0.30
  mix_sim: 0.10
  mix_mcts: 0.50
  value_use_synthetic: true
search:
  policy_candidates: 96
  structured_candidates: 24
  diverse_candidates: 96
  local_candidates: 48
  global_candidates: 16
  temperature: 1.35
  std_scale: 1.6
  kernel_bandwidth: 0.18
  uct_c: 0.02
  soft_topk: 24
  policy_temperature: 0.35
  noise_config: configs/noise/v1_bowling.json
  noise_samples: 8
  rollout_greedy_steps: 5    # EfficientZero n-step rollout (= unroll K); bootstrap, not terminal
  use_learned_model_prefilter: false
  terminal_rollout_scoring: false
  use_mcts_tree: true       # real multi-ply KR-UCT tree for the policy target
  mcts_sims: 48
  mcts_uct_c: 0.6
  rollout_temp: 0.6
horizon:
  start_horizon: 1
  max_horizon: 10
  rounds_per_stage: 1
  roots_per_stage: 150
  include_preplaced: true
  converge_band: 0.04
  converge_patience: 1
  h2h_games_per_order: 40
train:
  lr: 0.0003
  lr_pretrained: 5.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  epochs: 25
  batch_size: 256
  augment: true
  samples_per_epoch: 120000
  num_workers: 4
  gpus: [0, 1, 2, 3]
  ddp_backend: gloo
  run_name: anchor_mcts
