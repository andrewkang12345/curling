# FULL deployable model: the winning recipe (EXP-010) across ALL horizons 1..10, until convergence.
#   deep KR-UCT tree + value-head leaf bootstrap (closed loop via --value-world) + 2-step reward head
#   + policy_bc=0 (pure search distillation). Per-stage convergence by h2h winrate OR score margin.
# Inherits full-sheet path defaults (prior, human_csv, value data). base=None -> warm-start from the prior.
model:
  use_value: true
  use_policy: true
  use_dynamics: true
  use_consistency: true
  consistency_mode: simsiam
  use_outcome: false
  use_decoder: false
  use_step_reward: true
loss:
  policy_bc: 0.0
  policy_distill: 1.0
  value: 1.5
  value_nll: 0.2
  value_from_mcts: false
  consistency: 1.0
  outcome: 0.0
  step_reward: 0.5
replay:
  unroll_steps: 5
  mix_human: 0.0
  mix_value: 0.30
  mix_sim: 0.10
  mix_mcts: 0.60
  value_use_synthetic: true
search:
  noise_config: configs/noise/v2_fullsheet.json
  policy_candidates: 96
  diverse_candidates: 96
  soft_topk: 24
  noise_samples: 8
  rollout_greedy_steps: 5
  use_mcts_tree: true
  mcts_sims: 96
  mcts_k_widen: 2.0
  mcts_alpha_widen: 0.5
  mcts_uct_c: 0.6
  rollout_temp: 0.6
  collect_step_reward: true
  value_leaf_bootstrap: true
train:
  epochs: 8
  batch_size: 256
  samples_per_epoch: 90000
  gpus: [0, 1, 2, 3]
horizon:
  start_horizon: 1
  max_horizon: 10              # full game
  rounds_per_stage: 3          # closed loop iterates (r0 baseline value -> r1,r2 trained value head)
  roots_per_stage: 80
  include_preplaced: false
  converge_band: 0.04
  converge_margin_band: 0.10   # a clear +0.10 pts/end Δscore also counts as improvement
  converge_patience: 2
  h2h_games_per_order: 80      # reliable convergence decisions (40 was too noisy)
