# EXP-043 / az_v15 train config: the CORRECTED-LOOP recipe (post-EXP-042 matrix).
# vs exp_036 (the az_v13 fixed fine-tune recipe):
#   * (H2 fix) mix_value 0.30 -> 0.10 — the human-value anchor is demoted; the value head's
#     primary signal is realized returns from the training matchup's games (VFM=true).
#   * (H2 fix) value-drift guard re-based on MATCHUP-TRUE calibration:
#     select_value_guard_metric = val_value_mse_mcts (held-out realized-return MSE),
#     replacing human-play val_value_mse. Guard 3.60 (recent-generation level ~3.35 + 0.25).
#   * mix_mcts 0.60 -> 0.80 (the freed value slice goes to the matchup data).
# Unchanged from exp_036: significance-gated distillation (data-side dist_mask), aligned
# checkpoint selection (val_policy_distill_mcts on sig-masked val), patience early stop.
# Used with az_ratchet --gate-opponent incumbent (promotion = beat the incumbent h2h,
# dScore-primary — the AlphaZero gate, validated by the EXP-042 meta-game matrix).
model:
  hidden_dim: 256
  n_layers: 8
  n_heads: 4
  dropout: 0.1
  use_value: true
  use_policy: true
  use_dynamics: true
  use_consistency: true
  consistency_mode: simsiam
  use_outcome: false
  use_decoder: false
  use_step_reward: true
loss:
  policy_bc: 0.0
  policy_distill: 1.0
  value: 1.5
  value_nll: 0.2
  value_from_mcts: true
  consistency: 1.0
  outcome: 0.0
  step_reward: 0.5
  reward_action_conditioned: false
replay:
  unroll_steps: 5
  mix_human: 0.0
  mix_value: 0.10
  mix_sim: 0.10
  mix_mcts: 0.80
  value_use_synthetic: true
search:                        # unused (no collection) — present for config validity
  noise_config: configs/noise/v2_fullsheet.json
  noise_samples: 8
train:
  epochs: 20                   # budget ceiling; early stopping governs
  batch_size: 256
  samples_per_epoch: 90000
  augment: true
  gpus: [0, 1, 2, 3]
  run_name: exp045_L8_loop
  checkpoint_metric: val_policy_distill_mcts
  early_stop_patience: 4
  select_value_guard: 3.60
  select_value_guard_metric: val_value_mse_mcts
horizon:
  start_horizon: 1
  max_horizon: 10
  include_preplaced: true
  noisy_h2h: true
