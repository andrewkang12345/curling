model:
  hidden_dim: 256
  n_layers: 4
  n_heads: 4
  dropout: 0.1
  cond_dim: 3
  input_dim: 24
  action_dim: 4
  n_mixtures: 16
  use_value: true
  use_policy: true
  use_dynamics: true
  use_outcome: false
  use_decoder: false
  use_consistency: true
  consistency_mode: simsiam
  outcome_bins: 17
  ema_decay: 0.99
  warm_start_trunk: true
  warm_start_policy_head: true
  warm_start_value_head: true
loss:
  policy_bc: 1.0
  policy_distill: 1.0
  value: 1.0
  value_nll: 0.2
  outcome: 0.0
  consistency: 2.0
  decoder: 1.0
  value_clip: 8.0
replay:
  unroll_steps: 5
  mix_human: 0.3
  mix_value: 0.15
  mix_sim: 0.15
  mix_mcts: 0.4
  value_use_synthetic: true
  capacity_per_source: 400000
  shard_dir: artifacts/replay
train:
  epochs: 30
  batch_size: 1024
  lr: 0.0003
  lr_pretrained: 1.5e-05
  weight_decay: 0.0001
  grad_clip: 1.0
  warmup_steps: 200
  num_workers: 4
  amp: false
  seed: 0
  samples_per_epoch: 120000
  gpus:
  - 0
  - 1
  - 2
  - 3
  ddp_backend: gloo
  log_every: 50
  ckpt_dir: checkpoints
  run_name: csas_world_v1
search:
  policy_candidates: 96
  structured_candidates: 24
  diverse_candidates: 96
  local_candidates: 48
  global_candidates: 16
  temperature: 1.35
  std_scale: 1.6
  kernel_bandwidth: 0.18
  uct_c: 0.02
  soft_topk: 24
  policy_temperature: 0.35
  noise_config: configs/noise/v1_bowling.json
  noise_samples: 2
  rollout_greedy_steps: 5
  use_learned_model_prefilter: false
horizon:
  start_horizon: 1
  max_horizon: 10
  rounds_per_stage: 3
  roots_per_stage: 1500
  include_preplaced: true
  converge_band: 0.04
  converge_patience: 2
  h2h_games_per_order: 200
paths:
  csas_v3_root: /mnt/data/curling2/csas_v3
  human_csv: data/processed/inverse_realistic.csv
  preplaced_csv: data/processed/preplaced/first_shots_inverse.csv
  value_data_stones: data/raw/2026/Stones.csv
  value_data_ends: data/raw/2026/Ends.csv
  value_synth_stones: data/processed/synthetic_terminal/Stones.csv
  value_synth_ends: data/processed/synthetic_terminal/Ends.csv
  prior_policy_ckpt: checkpoints/policy/human_prior_fullcov/best.pt
  prior_value_ckpt: checkpoints/value/holdout0/model.pt
  baseline_policy_ckpts:
  - checkpoints/policy/human_prior_fullcov/model.pt
  - checkpoints/policy/mcts_horizon/h05/model.pt
  - checkpoints/policy/mcts_horizon/h10/model.pt
  baseline_value_ckpt: checkpoints/value/holdout0/model.pt
