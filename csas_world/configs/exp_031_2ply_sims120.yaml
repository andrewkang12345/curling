# EXP-031 / az_v8 collect-time config: 2-ply tree with a CONCENTRATED sim budget.
# Diff vs exp_026_2ply_valuemcts.yaml (az_v6's config):
#   * mcts_sims: 60 -> 120     (2x evidence per record; collect ~2x wall-clock)
#   * mcts_k_widen: 2.0 -> 1.5 (widen slower -> root ~16 children with ~7-8 visits each,
#                               child nodes ~4 grandchildren with ~2 visits, vs 4/1 before)
# Motivation: at 60 sims the 2-ply tree was starved (~4 visits/root child, ~1 visit per
# opponent-response sample). Kernel regression pools evidence across neighboring actions,
# but the per-action counts were thin. This config concentrates and deepens the evidence
# for the az_v8 accumulating ratchet loop.
model:
  use_value: true
  use_policy: true
  use_dynamics: true
  use_consistency: true
  consistency_mode: simsiam
  use_outcome: false
  use_decoder: false
  use_step_reward: true
loss:
  policy_bc: 0.0
  policy_distill: 1.0
  value: 1.5
  value_nll: 0.2
  value_from_mcts: false    # collect-time only — the actual training cfg is exp_021_valuemcts_earlystop
  consistency: 1.0
  outcome: 0.0
  step_reward: 0.5
replay:
  unroll_steps: 5
  mix_human: 0.0
  mix_value: 0.30
  mix_sim: 0.10
  mix_mcts: 0.60
  value_use_synthetic: true
search:
  noise_config: configs/noise/v2_fullsheet.json
  policy_candidates: 96
  diverse_candidates: 96
  soft_topk: 24
  noise_samples: 8                  # still used inside the leaf evaluation for noise averaging
  rollout_greedy_steps: 5
  use_mcts_tree: true               # CHANGED: turn on KR-UCT tree
  mcts_sims: 120                    # 2x az_v6 budget
  mcts_k_widen: 1.5                 # widen slower -> concentrate visits (default was 2.0)
  mcts_max_depth: 2                 # 2-ply cap (same as az_v6)
  value_leaf_bootstrap: true        # CHANGED: value-head bootstrap at leaves (no terminal rollout)
  search_root_only: false           # CHANGED: grandchildren are required at depth 2
  terminal_rollout_scoring: false
  reward_leaf_select: false         # tree-q ranks candidates, not r̂₂
  collect_step_reward: true         # still collect reward targets for the r̂₂ head
train:
  epochs: 8
  batch_size: 256
  samples_per_epoch: 90000
  gpus: [0, 1, 2, 3]
horizon:
  start_horizon: 1
  max_horizon: 10
  rounds_per_stage: 2
  roots_per_stage: 80
  include_preplaced: true
  converge_band: 0.04
  converge_margin_band: 0.10
  converge_patience: 2
  h2h_games_per_order: 80
  noisy_h2h: true
