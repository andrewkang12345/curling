# EXP-017: scale the PROVEN EXP-013 recipe (1-ply-ROBUST r̂₂ selector — the first config to beat the
# human prior under noise, 0.541) into the FULL 1→10 deployable model. Recipe IDENTICAL to EXP-013
# (state-conditioned 2-step reward head, candidate value = mean over K=8 noisy executions of -r̂₂(post),
# EZ 1-ply path + noise averaging = the 1-ply-robust scorer, closed r̂₂ loop via --value-world round 1+);
# scaled to all horizons 1→10 with deployable-grade roots + reliable h2h (EXP-011 full settings).
model:
  use_value: true
  use_policy: true
  use_dynamics: true
  use_consistency: true
  consistency_mode: simsiam
  use_outcome: false
  use_decoder: false
  use_step_reward: true        # state-conditioned (reward_action_conditioned defaults false)
loss:
  policy_bc: 0.0
  policy_distill: 1.0
  value: 1.5
  value_nll: 0.2
  value_from_mcts: false
  consistency: 1.0
  outcome: 0.0
  step_reward: 0.5
replay:
  unroll_steps: 5
  mix_human: 0.0
  mix_value: 0.30
  mix_sim: 0.10
  mix_mcts: 0.60
  value_use_synthetic: true
search:
  noise_config: configs/noise/v2_fullsheet.json
  policy_candidates: 96
  diverse_candidates: 96
  soft_topk: 24
  noise_samples: 8             # K noisy executions averaged per candidate -> 1-ply-robust selection
  rollout_greedy_steps: 5
  use_mcts_tree: false         # EZ 1-ply path (not the deep tree) -> uses the noise_samples robust scorer
  terminal_rollout_scoring: false
  reward_leaf_select: true     # candidate value = -r̂₂(post)
  collect_step_reward: true    # train the 2-step reward head
train:
  epochs: 8
  batch_size: 256
  samples_per_epoch: 90000
  gpus: [0, 1, 2, 3]
horizon:
  start_horizon: 1
  max_horizon: 10              # h10 = the first thrown stone (throws_remaining==10), absent from the
                               # human data (annotators skipped the pre-placed first shot). With
                               # include_preplaced=true, build_roots now serves canonical pre-placed
                               # start-of-end states (standard/pp_left/pp_right) at h10 (src/world/preplaced.py).
  rounds_per_stage: 2          # r0 uses prior stage's r̂₂ (or -V at h1); r1 uses this stage's trained r̂₂
  roots_per_stage: 80          # deployable-grade (EXP-011 full setting; EXP-013 used 64)
  include_preplaced: true      # serve canonical pre-placed start-of-end states at h10 (src/world/preplaced.py)
  converge_band: 0.04
  converge_margin_band: 0.10
  converge_patience: 2
  h2h_games_per_order: 80      # reliable convergence decisions (EXP-011; EXP-013 used 30)
  noisy_h2h: true
